apiVersion: v1
kind: Plugin
metadata:
  author: query-bot
  name: PSRAsk
  version: 0.1.0
  repository: https://github.com/brentlee-personal/query-bot/tree/main/plugins/psr-ask
  label:
    en_US: PSR Ask
    zh_Hans: PSR 查询接入
  description:
    en_US: Call an existing PSR ToB /ask endpoint and return the backend answer as a LangBot Runner.
    zh_Hans: 调用现有 PSR ToB /ask 接口，将后端答案作为 LangBot Runner 返回。
spec:
  config: []
  components:
    Runner:
      fromDirs:
        - path: components/runner/
  pages: []
execution:
  python:
    path: main.py
    attr: PSRAskPlugin
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
